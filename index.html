<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Lotería Draw</title>
<style>
  :root {
    --paper: #fdf6e9;
    --ink: #2b2118;
    --accent: #f46122; /* orange */
    --accent2: #1184bb; /* blue */
    --gold: #fee9a7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: radial-gradient(circle at top, #fff9ee 0%, #fee9a7 60%, #ffcb2e 100%);
    font-family: "Figtree", "Helvetica", sans-serif;
    color: var(--ink);
    padding: 32px 16px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 2.1rem;
    letter-spacing: 1px;
    text-align: center;
  }
  p.sub {
    margin: 0 0 28px;
    opacity: 0.75;
    text-align: center;
  }
  .layout {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 900px;
  }
  .main-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card-frame {
    width: 280px;
    aspect-ratio: 900 / 1380;
    background: var(--paper);
    border: 20px solid var(--paper);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .card-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .placeholder {
    color: #8a7a5c;
    font-size: 1rem;
    text-align: center;
    padding: 20px;
  }
  .drawn-number {
    margin-top: 16px;
    font-size: 1.1rem;
    font-weight: bold;
    text-transform: uppercase;
    color: var(--ink);
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 20px;
    font-size: 1.0rem;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  button:hover { background: #a7301c; transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: default; transform: none; }
  button.shuffle-btn {
    background: var(--accent2);
  }
  button.shuffle-btn:hover { background: #2067a4; }
  button.pause-btn {
    background: var(--ink);
  }
  button.pause-btn:hover { background: #45362a; }
  .deck-status {
    margin-top: 14px;
    font-size: 0.9rem;
    opacity: 0.7;
    text-align: center;
  }
  .auto-timer {
    margin-top: 4px;
    font-size: 0.8rem;
    opacity: 0.55;
    text-align: center;
  }

  .history-panel {
    width: 220px;
    background: rgba(255,255,255,0.5);
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 16px;
    max-height: 480px;
    display: flex;
    flex-direction: column;
  }
  .history-panel h2 {
    margin: 0 0 10px;
    font-size: 1rem;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    letter-spacing: 0.5px;
  }
  .history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    font-weight: 300;
    text-transform: uppercase;
    background: var(--paper);
    border-radius: 8px;
    padding: 6px 8px;
  }
  .history-list li:first-child {
    background: var(--gold);
  }
  .history-list img {
    width: 34px;
    height: 52px;
    object-fit: contain;
    border-radius: 4px;
    background: #fff;
  }
  .history-empty {
    font-size: 0.85rem;
    opacity: 0.6;
    text-align: center;
    padding: 12px 4px;
  }

  @keyframes flipIn {
    0% { transform: rotateY(90deg) scale(0.9); opacity: 0; }
    100% { transform: rotateY(0deg) scale(1); opacity: 1; }
  }
  .card-frame.flip img { animation: flipIn 0.35s ease-out; }

  @media (max-width: 640px) {
    .layout { flex-direction: column; align-items: center; }
    .history-panel { width: 280px; max-height: 240px; }
  }
</style>
</head>
<body>

  <h1>🎉 Lotería Dealer 🎉</h1>
  <p class="sub">Draw a random card from the Lotería deck! New card is auto-drawn every 30 seconds.</p>

  <div class="layout">
    <div class="main-panel">
      <div class="card-frame" id="cardFrame">
        <div class="placeholder" id="placeholder">Press "Draw a Card" to begin</div>
      </div>

      <div class="drawn-number" id="drawnNumber"></div>

      <div class="controls">
        <button id="drawBtn">Draw a Card</button>
        <button class="shuffle-btn" id="shuffleBtn">Shuffle Deck</button>
        <button class="pause-btn" id="pauseBtn">Pause</button>
      </div>

      <div class="deck-status" id="deckStatus"></div>
      <div class="auto-timer" id="autoTimer"></div>
    </div>

    <div class="history-panel">
      <h2>Previously Drawn</h2>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

<script>
  const TOTAL_CARDS = 54;
  const AUTO_DRAW_SECONDS = 30;

  function cardFilename(n) {
    // Deck uses Card01.png for card 1, Card2.png..Card54.png for the rest
    return n === 1 ? "Card01.png" : "Card" + n + ".png";
  }

  // Spanish name printed on each card, read directly off the artwork
  const CARD_NAMES = {
    1: "El Gallo", 2: "El Diablito", 3: "La Dama", 4: "El Catrín", 5: "El Paraguas",
    6: "La Sirena", 7: "La Escalera", 8: "La Botella", 9: "El Barril", 10: "El Árbol",
    11: "El Melón", 12: "El Valiente", 13: "El Gorrito", 14: "La Muerte", 15: "La Pera",
    16: "La Bandera", 17: "La Guitarra", 18: "El Violoncello", 19: "La Cisne", 20: "El Pájaro",
    21: "La Mano", 22: "La Bota", 23: "La Luna", 24: "El Cotorro", 25: "El Bufón",
    26: "El Banquero", 27: "El Corazón", 28: "La Sandía", 29: "El Tambor", 30: "El Camarón",
    31: "Las Jaras", 32: "El Músico", 33: "La Araña", 34: "El Soldado", 35: "La Estrella",
    36: "El Cazo", 37: "El Mundo", 38: "El Escolar", 39: "El Nopal", 40: "El Alacrán",
    41: "La Rosa", 42: "La Calavera", 43: "La Campana", 44: "El Cantarito", 45: "El Venado",
    46: "El Sol", 47: "La Corona", 48: "La Chalupa", 49: "El Pino", 50: "El Pescado",
    51: "La Palma", 52: "La Maceta", 53: "El Acordeón", 54: "La Rana"
  };

  function cardLabel(n) {
    return n + " " + CARD_NAMES[n];
  }

  let remaining = [];
  let history = [];
  let countdown = AUTO_DRAW_SECONDS;
  let timerId = null;
  let isPaused = false;

  function freshDeck() {
    return Array.from({ length: TOTAL_CARDS }, (_, i) => i + 1);
  }

  function resetDeck() {
    remaining = freshDeck();
    history = [];
    renderHistory();
    document.getElementById("cardFrame").innerHTML = '<div class="placeholder" id="placeholder">Press "Draw a Card" to begin</div>';
    document.getElementById("drawnNumber").textContent = "";
    document.getElementById("drawBtn").disabled = false;
    updateStatus();
    restartAutoTimer();
  }

  function shuffleDeck() {
    // Shuffle at any point in the deck: puts drawn cards back in and clears the drawn history
    resetDeck();
  }

  function updateStatus() {
    document.getElementById("deckStatus").textContent =
      remaining.length + " of " + TOTAL_CARDS + " cards left in the deck";
  }

  function renderHistory() {
    const list = document.getElementById("historyList");
    if (history.length === 0) {
      list.innerHTML = '<div class="history-empty">No cards drawn yet</div>';
      return;
    }
    list.innerHTML = history
      .map(function (n) {
        return '<li><img src="Cards/' + cardFilename(n) + '" alt="' + cardLabel(n) + '"><span>' + cardLabel(n) + '</span></li>';
      })
      .join("");
  }

  function drawCard() {
    if (remaining.length === 0) return;
    const idx = Math.floor(Math.random() * remaining.length);
    const cardNum = remaining.splice(idx, 1)[0];

    const frame = document.getElementById("cardFrame");
    frame.classList.remove("flip");
    void frame.offsetWidth; // restart animation
    frame.innerHTML = '<img src="Cards/' + cardFilename(cardNum) + '" alt="' + cardLabel(cardNum) + '">';
    frame.classList.add("flip");

    document.getElementById("drawnNumber").textContent = cardLabel(cardNum);

    history.unshift(cardNum);
    renderHistory();
    updateStatus();

    if (remaining.length === 0) {
      document.getElementById("drawBtn").disabled = true;
    }

    restartAutoTimer();
  }

  function restartAutoTimer() {
    countdown = AUTO_DRAW_SECONDS;
    updateTimerLabel();
  }

  function updateTimerLabel() {
    const label = document.getElementById("autoTimer");
    if (isPaused) {
      label.textContent = "Auto-draw paused";
    } else if (remaining.length === 0) {
      label.textContent = "Deck empty — shuffle to keep drawing";
    } else {
      label.textContent = "Next automatic draw in " + countdown + "s";
    }
  }

  function tick() {
    if (isPaused) return;
    if (remaining.length > 0) {
      countdown -= 1;
      if (countdown <= 0) {
        drawCard(); // this also calls restartAutoTimer()
        return;
      }
    }
    updateTimerLabel();
  }

  function togglePause() {
    isPaused = !isPaused;
    const pauseBtn = document.getElementById("pauseBtn");
    pauseBtn.textContent = isPaused ? "Resume" : "Pause";
    if (!isPaused) {
      // Give a fresh full countdown when resuming rather than drawing immediately
      countdown = AUTO_DRAW_SECONDS;
    }
    updateTimerLabel();
  }

  document.getElementById("drawBtn").addEventListener("click", drawCard);
  document.getElementById("shuffleBtn").addEventListener("click", shuffleDeck);
  document.getElementById("pauseBtn").addEventListener("click", togglePause);

  resetDeck();
  timerId = setInterval(tick, 1000);
</script>

</body>
</html>
